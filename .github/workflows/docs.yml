name: Documentation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rustdoc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo doc --workspace --no-deps
