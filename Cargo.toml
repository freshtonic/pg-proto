[package]
name = "pg-proto"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Session-typed PostgreSQL wire protocol"

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bytes = "1.12.1"
postgres-protocol = "0.6.12"
tokio-util = { version = "0.7.19", features = ["codec"] }

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
