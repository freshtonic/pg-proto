[package]
name = "pg-proto-burn-in"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
pg-proto = { version = "0.11.1", path = ".." }
postgres-protocol = "0.6.12"
rcgen = "0.14.8"
rustls = "0.23.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }

[dev-dependencies]
tempfile = "3.20"
